<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fee Payment Reminder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7ff;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 350px;
      text-align: center;
    }
    h2 {
      color: #2d4f9d;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      border: none;
      background: #2d4f9d;
      color: #fff;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #1e3570;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #e9f0ff;
      border-left: 4px solid #2d4f9d;
      display: none;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Fee Payment Reminder</h2>

    <label>Student Name</label>
    <input id="name" type="text" placeholder="Enter name" />

    <label>Due Date</label>
    <input id="dueDate" type="date" />

    <label>Amount</label>
    <input id="amount" type="number" placeholder="Enter amount" />

    <button onclick="generateReminder()">Generate Reminder</button>

    <div class="result" id="output"></div>
  </div>

  <script>
    function generateReminder() {
      const name = document.getElementById('name').value;
      const dueDate = document.getElementById('dueDate').value;
      const amount = document.getElementById('amount').value;
      const output = document.getElementById('output');

      if (!name || !dueDate || !amount) {
        alert('Please fill all fields');
        return;
      }

      const due = new Date(dueDate);
      const today = new Date();

      let message = '';

      if (today < due) {
        message = `Dear ${name}, your fee of ₹${amount} is due on ${due.toDateString()}. Please make the payment on or before the due date.`;
      } else {
        message = `Dear ${name}, your fee of ₹${amount} was due on ${due.toDateString()}. Please make the payment immediately to avoid penalties.`;
      }

      output.innerText = message;
      output.style.display = 'block';
    }
  </script>
</body>
</html>
